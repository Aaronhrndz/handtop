# On-screen bar (volume), fed by the input daemon. See wob.ini(5).
timeout = 1200
max = 100
width = 260
height = 28
border_offset = 3
border_size = 2
bar_padding = 3
anchor = top center
margin = 40
border_color = 3D5A8A
background_color = 1a1e26E6
bar_color = 8FB4FF
overflow_mode = nowrap
output_mode = focused
